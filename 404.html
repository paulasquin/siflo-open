<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ouvrir dans Siflo</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1f22;--muted:#626872;--accent:#e2621b}
@media (prefers-color-scheme:dark){:root{--bg:#141518;--fg:#e9e7e2;--muted:#a0a5ad;--accent:#ff6a00}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:48px max(20px,env(safe-area-inset-left)) 48px max(20px,env(safe-area-inset-right))}
main{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0}
p{margin:0;color:var(--muted)}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px;text-align:center}
a.back{color:var(--muted)}
</style>
<main>
  <h1 id="t">Ce lien s’ouvre dans Siflo</h1>
  <p id="p">Installez Siflo ou mettez-le à jour, puis touchez à nouveau le lien.</p>
  <a class="btn" id="store" href="https://apps.apple.com/app/id6827630745">Siflo sur l’App Store</a>
  <a class="back" id="back" href="https://siflo.app/">Revenir à la page du lien</a>
</main>
<script>
// open.siflo.app only exists so that iPhones hand app links to Siflo through a universal link (an associated
// domain bound to the app's team) instead of the siflo:// scheme any app can claim. This page shows when the link
// was not handed over: Siflo missing or too old on an iPhone, or any other device. The fragment (an invitation,
// a contact link) stays in the address bar and is never sent to a server.
const back = 'https://siflo.app' + location.pathname + location.search + location.hash;
if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) location.replace(back);
document.getElementById('back').href = back;
if (!/^fr\b/i.test(navigator.language || '')) {
  document.documentElement.lang = 'en';
  document.title = 'Open in Siflo';
  document.getElementById('t').textContent = 'This link opens in Siflo';
  document.getElementById('p').textContent = 'Install or update Siflo, then tap the link again.';
  document.getElementById('store').textContent = 'Siflo on the App Store';
  document.getElementById('back').textContent = 'Back to the link’s page';
}
</script>
</html>
